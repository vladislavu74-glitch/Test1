name: JobMonitor
options:
  bundleIdPrefix: com.castleduck
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  JobMonitor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: JobMonitor
    preBuildScripts:
      - name: Generate BuildInfo.swift
        script: |
          set -e
          COMMIT=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          mkdir -p "$SRCROOT/JobMonitor/Generated"
          cat > "$SRCROOT/JobMonitor/Generated/BuildInfo.swift" <<SWIFT
          // Автогенерируется build-скриптом (project.yml) перед каждой сборкой — не редактировать вручную.
          enum BuildInfo {
              static let gitCommitHash = "$COMMIT"
              static let builtAt = "$DATE"
          }
          SWIFT
        outputFiles:
          - $(SRCROOT)/JobMonitor/Generated/BuildInfo.swift
        basedOnDependencyAnalysis: false
    info:
      path: JobMonitor/Info.plist
      properties:
        CFBundleDisplayName: Job Monitor
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Разрешаем произвольные (в т.ч. http) соединения — приложение личное,
        # backend в первое время обычно тестируется по локальному IP без TLS.
        # Для боевого backend'а на своём домене с HTTPS это можно убрать.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vladislav-utkin.jobmonitor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 72ZNG32DX7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
